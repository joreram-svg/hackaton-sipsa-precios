[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sipsa-data"
version = "0.1.0"
description = "Capa de datos SIPSA para señales de precios mayoristas en Colombia"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10,<4",
  "duckdb>=1.1",
  "fastapi>=0.115",
  "fastmcp>=2.0",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "pydantic>=2",
  "pydantic-settings>=2",
  "python-dotenv>=1",
  "python-telegram-bot>=21,<23",
  "uvicorn>=0.30",
  "zeep>=4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/sipsa"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
